<svg width="900" height="344" viewBox="0 0 900 344" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card"><rect width="900" height="344" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="344" fill="#101B2A"/>

    <!-- Window chrome -->
    <rect x="20" y="14" width="20" height="20" rx="5" fill="#444852"/>
    <text x="30" y="28" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#EBEBF0">&gt;_</text>
    <text x="52" y="29" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#EBEBF0">CloudShell</text>

    <!-- Tab bar — underline width=60 trimmed to match "us-east-1" text width -->
    <text x="22" y="67" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#EBEBF0">us-east-1</text>
    <rect x="22" y="78" width="60" height="2" rx="1" fill="#41B4FF"/>
    <text x="118" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#7C8798">+</text>

    <!--
      ══════════════════════════════════════════════
        TIMELINE  dur=20s
      ══════════════════════════════════════════════
        0.00s  prompt "[cloudshell-user@aws-us-east-1 ~]$ " appears
        0.10s  "w" typed (200 ms per char from here)
        0.30s  "wh"
        0.50s  "who"
        0.70s  "whoa"
        0.90s  "whoam"
        1.10s  "whoami"  ← typing done
        1.30s  typing cursor hides (0.2 s process pause)
        1.30s  ASCII row 1 fades in
        1.65s  row 2
        2.00s  row 3
        2.35s  row 4
        2.70s  row 5   ← PHURIN complete
        3.20s  subtitle + italic appear
        3.70s  2nd prompt + idle cursor begin
        3.70s ─────────────── 12 s WAIT ─────────────
        15.70s idle cursor hides, "exit" appears
        16.50s wipe/fade out
        16.80s all gone
        16.80s–20s  3.2 s blank hold → restart
      ══════════════════════════════════════════════
      All keyTimes are time/20 fractions.
    -->

    <!--
      ── TYPING STAGES ──
      Full string per stage at x=22 so there is ZERO gap between
      prompt and typed characters (no split-element positioning needed).
      Each stage is instantaneously swapped (0.001 s crossfade).
    -->

    <!-- Stage 0: prompt only — t=0.0 → 0.1s  (kf 0.001 → 0.005) -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.001;0.005;0.006;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Stage 1: w — t=0.1 → 0.3s  (kf 0.005 → 0.015) -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ w<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.005;0.006;0.015;0.016;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Stage 2: wh — t=0.3 → 0.5s  (kf 0.015 → 0.025) -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ wh<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.015;0.016;0.025;0.026;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Stage 3: who — t=0.5 → 0.7s  (kf 0.025 → 0.035) -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ who<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.025;0.026;0.035;0.036;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Stage 4: whoa — t=0.7 → 0.9s  (kf 0.035 → 0.045) -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ whoa<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.035;0.036;0.045;0.046;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Stage 5: whoam — t=0.9 → 1.1s  (kf 0.045 → 0.055) -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ whoam<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.045;0.046;0.055;0.056;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Stage 6: whoami — t=1.1s → wipe  (kf 0.055 → 0.825) -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ whoami<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.055;0.056;0.825;0.840;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!--
      ── TYPING CURSOR ──
      Visible t=0.0 → 1.3s (kf 0.001 → 0.065).
      x steps right with each character using calcMode=discrete.
      Cursor positions based on 41-char string at x=22:
        prompt only (35 ch):  22 + 35×9.61 = 358
        after w      (36 ch):  22 + 36×9.61 = 368
        after wh     (37 ch):  22 + 37×9.61 = 378
        after who    (38 ch):  22 + 38×9.61 = 387
        after whoa   (39 ch):  22 + 39×9.61 = 397
        after whoam  (40 ch):  22 + 40×9.61 = 407
        after whoami (41 ch):  22 + 41×9.61 = 416
    -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.001;0.002;0.065;0.066;1" dur="20s" begin="0s" repeatCount="indefinite"/>
      <rect y="94" width="9" height="17" fill="#F0F0F0">
        <animate attributeName="x" values="358;358;368;378;387;397;407;416;416" keyTimes="0;0.001;0.005;0.015;0.025;0.035;0.045;0.055;1" calcMode="discrete" dur="20s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.9s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ── ASCII ROW 1 ── 1.30s = kf 0.065 in, 0.078 full -->
    <text x="22" y="138" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0"> ____  _   _ _   _ ____  ___ _   _ <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.065;0.078;0.825;0.840;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── ASCII ROW 2 ── 1.65s = kf 0.0825 in, 0.095 full -->
    <text x="22" y="159" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">|  _ \| | | | | | |  _ \|_ _| \ | |<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0825;0.095;0.825;0.840;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── ASCII ROW 3 ── 2.00s = kf 0.100 in, 0.113 full -->
    <text x="22" y="180" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">| |_) | |_| | | | | |_) || ||  \| |<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.100;0.113;0.825;0.840;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── ASCII ROW 4 ── 2.35s = kf 0.1175 in, 0.130 full -->
    <text x="22" y="201" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">|  __/|  _  | |_| |  _ &lt; | || |\  |<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1175;0.130;0.825;0.840;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── ASCII ROW 5 ── 2.70s = kf 0.135 in, 0.148 full -->
    <text x="22" y="222" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">|_|   |_| |_|\___/|_| \_\___|_| \_|<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.135;0.148;0.825;0.840;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── SUBTITLE ── 3.20s = kf 0.160 in, 0.173 full -->
    <text x="22" y="253" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" opacity="0">Aspiring Cloud &amp; Serverless Architect<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.160;0.173;0.825;0.840;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── ITALIC ── 3.20s = kf 0.160 in, 0.173 full -->
    <text x="22" y="278" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-style="italic" fill="#9AA5B4" opacity="0">CS @ Thammasat University &#183; Designing event-driven, serverless architectures on AWS<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.160;0.173;0.825;0.840;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── 2ND PROMPT (no exit) ── 3.70s = kf 0.185, disappears at kf 0.785 -->
    <text x="22" y="310" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.185;0.186;0.785;0.786;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

    <!--
      ── IDLE CURSOR ──
      Blinks at end of 2nd prompt for 12 seconds.
      t=3.70s (kf 0.185) → t=15.70s (kf 0.785)
      x=358 = end of 35-char prompt at x=22
    -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.185;0.186;0.785;0.786;1" dur="20s" begin="0s" repeatCount="indefinite"/>
      <rect x="358" y="296" width="9" height="17" fill="#F0F0F0">
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.9s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ── EXIT LINE ── 15.70s = kf 0.785, fades with wipe at kf 0.825 -->
    <text x="22" y="310" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ exit<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.785;0.786;0.825;0.840;1" dur="20s" begin="0s" repeatCount="indefinite"/></text>

  </g>
</svg>