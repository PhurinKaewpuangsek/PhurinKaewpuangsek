    <rect x="20" y="14" width="20" height="20" rx="5" fill="#444852"/>
    <text x="30" y="28" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#EBEBF0">&gt;_</text>
    <text x="52" y="29" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#EBEBF0">CloudShell</text>

    <!-- tab row -->
    <text x="22" y="67" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#EBEBF0">us-east-1</text>
    <rect x="22" y="78" width="82" height="2" rx="1" fill="#41B4FF"/>
    <text x="118" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#7C8798">+</text>

    <!-- terminal body -->
<text x="40" y="118" font-family="SFMono-Regular,Menlo,Consolas,'Fira Code',monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ whoami<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.001;1" dur="10.0s" begin="0.0s" repeatCount="indefinite" fill="freeze"/></text>
<text x="40" y="146" font-family="SFMono-Regular,Menlo,Consolas,'Fira Code',monospace" font-size="16" fill="#F0F0F0" opacity="0">Phurin Kaewpuangsek — Aspiring Cloud &amp; Serverless Architect<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.001;1" dur="10.0s" begin="1.3s" repeatCount="indefinite" fill="freeze"/></text>
<text x="40" y="174" font-family="SFMono-Regular,Menlo,Consolas,'Fira Code',monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ cat ./focus.txt<animate attributeName="opacity" values="0;1;1" keyTimes="0;0.001;1" dur="10.0s" begin="2.9s" repeatCount="indefinite" fill="freeze"/></text>
