<svg width="900" height="344" viewBox="0 0 900 344" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card"><rect width="900" height="344" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="344" fill="#101B2A"/>

    <!-- Window chrome -->
    <rect x="20" y="14" width="20" height="20" rx="5" fill="#444852"/>
    <text x="30" y="28" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#EBEBF0">&gt;_</text>
    <text x="52" y="29" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#EBEBF0">CloudShell</text>

    <!-- Tab bar -->
    <text x="22" y="67" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#EBEBF0">us-east-1</text>
    <rect x="22" y="78" width="82" height="2" rx="1" fill="#41B4FF"/>
    <text x="118" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#7C8798">+</text>

    <!--
      TIMELINE — total loop dur=13s
      0.00s  whoami line appears
      0.00–1.00s  cursor blinks (1s "jam")
      1.00s  ASCII row 1 fades in
      1.35s  ASCII row 2
      1.70s  ASCII row 3
      2.05s  ASCII row 4
      2.40s  ASCII row 5  ← PHURIN fully formed
      3.00s  subtitle + italic appear
      3.50s  2nd prompt appears, cursor starts blinking
      8.50s  cursor hides, "exit" types
      9.50s  fade-out / wipe begins
      9.80s  screen blank
      9.80–13s  3-second hold before restart
    -->

    <!-- whoami prompt  | 0→0.004, hold, 9.5/13=0.731, 9.8/13=0.754 -->
    <text x="40" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ whoami<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.004;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- cursor after whoami  | 0→0.004, visible until 1s (0.077), then gone -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.004;0.077;0.081;1" dur="13s" begin="0s" repeatCount="indefinite"/>
      <rect x="434" y="94" width="9" height="17" fill="#F0F0F0"><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.9s" begin="0s" repeatCount="indefinite"/></rect>
    </g>

    <!-- ASCII row 1 — appears 1.0s (0.077), fades with wipe -->
    <text x="40" y="138" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0"> ____  _   _ _   _ ____  ___ _   _ <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.077;0.096;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ASCII row 2 — 1.35s (0.104) -->
    <text x="40" y="159" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">|  _ \| | | | | | |  _ \|_ _| \ | |<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.104;0.123;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ASCII row 3 — 1.70s (0.131) -->
    <text x="40" y="180" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">| |_) | |_| | | | | |_) || ||  \| |<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.131;0.150;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ASCII row 4 — 2.05s (0.158) -->
    <text x="40" y="201" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">|  __/|  _  | |_| |  _ &lt; | || |\  |<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.158;0.177;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ASCII row 5 — 2.40s (0.185) -->
    <text x="40" y="222" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">|_|   |_| |_|\___/|_| \_\___|_| \_|<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.185;0.204;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Subtitle — 3.0s (0.231) -->
    <text x="40" y="253" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" opacity="0">Aspiring Cloud &amp; Serverless Architect<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.231;0.246;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Italic — 3.0s (0.231) -->
    <text x="40" y="278" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-style="italic" fill="#9AA5B4" opacity="0">CS @ Thammasat University &#183; Designing event-driven, serverless architectures on AWS<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.231;0.246;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- 2nd prompt (no exit) — 3.5s (0.269), fades at wipe -->
    <text x="40" y="310" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.269;0.285;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- cursor at 2nd prompt — blinks 3.5s→8.5s (0.654), then hides for "exit" -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.269;0.285;0.654;0.658;1" dur="13s" begin="0s" repeatCount="indefinite"/>
      <rect x="380" y="296" width="9" height="17" fill="#F0F0F0"><animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.9s" begin="0s" repeatCount="indefinite"/></rect>
    </g>

    <!-- 2nd prompt WITH "exit" — 8.5s (0.654), fades at wipe 9.5s (0.731) -->
    <text x="40" y="310" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ exit<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.654;0.669;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

  </g>
</svg>