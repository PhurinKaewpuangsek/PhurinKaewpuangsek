<svg width="900" height="344" viewBox="0 0 900 344" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card"><rect width="900" height="344" rx="14"/></clipPath>
    <!--
      TIMELINE (total loop = 20s)
      0.00s  – whoami line appears (instant, simulates fast typing)
      0.10s  – cursor blinks after whoami
      1.00s  – cursor disappears (1s "jam" / processing pause)
      1.00s  – ASCII row 1 fades in
      1.35s  – ASCII row 2 fades in
      1.70s  – ASCII row 3 fades in
      2.05s  – ASCII row 4 fades in
      2.40s  – ASCII row 5 fades in
      3.00s  – subtitle + italic appear
      3.50s  – second prompt [cloudshell-user@…]$ appears
      3.50s  – cursor blinks for ~5s at second prompt
      8.50s  – cursor disappears, "exit" types in
      9.50s  – everything fades out (wipe)
      9.80s – 20s: blank (loop hold before restart)
    -->
  </defs>
  <g clip-path="url(#card)">
    <!-- Background -->
    <rect width="900" height="344" fill="#101B2A"/>

    <!-- Window chrome: icon -->
    <rect x="20" y="14" width="20" height="20" rx="5" fill="#444852"/>
    <text x="30" y="28" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#EBEBF0">&gt;_</text>
    <text x="52" y="29" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#EBEBF0">CloudShell</text>

    <!-- Tab bar -->
    <text x="22" y="67" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#EBEBF0">us-east-1</text>
    <rect x="22" y="78" width="82" height="2" rx="1" fill="#41B4FF"/>
    <text x="118" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#7C8798">+</text>

    <!--
      ═══════════════════════════════════════
        LINE 1: [cloudshell-user@…]$ whoami
        Appears at 0s, stays until wipe at 9.5s
        keyTimes fractions (dur=20s):
          0/20=0, 0.05/20=0.0025, 9.5/20=0.475, 9.8/20=0.49, 1
      ═══════════════════════════════════════
    -->
    <text x="40" y="108" xml:space="preserve"
          font-family="SFMono-Regular,Menlo,Consolas,monospace"
          font-size="16" fill="#F0F0F0" opacity="0">
      [cloudshell-user@aws-us-east-1 ~]$ whoami
      <animate attributeName="opacity"
               values="0;1;1;0;0"
               keyTimes="0;0.0025;0.475;0.49;1"
               dur="20s" begin="0s" repeatCount="indefinite"/>
    </text>

    <!--
      Blinking cursor after "whoami" (x=434 is end of that text)
      Visible from 0.05s–1.0s (while "jammed"), then gone.
      keyTimes: 0/20=0, 0.05/20=0.0025, 1.0/20=0.05, 1.05/20=0.0525, 1
    -->
    <g opacity="0">
      <animate attributeName="opacity"
               values="0;1;1;0;0"
               keyTimes="0;0.0025;0.05;0.0525;1"
               dur="20s" begin="0s" repeatCount="indefinite"/>
      <rect x="434" y="94" width="9" height="17" fill="#F0F0F0">
        <animate attributeName="opacity"
                 values="1;0;1" keyTimes="0;0.5;1"
                 dur="0.9s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!--
      ═══════════════════════════════════════
        ASCII ART – row by row, top→bottom
        Each row fades in individually (0.25s fade window each)
        Row offsets: 1.0s, 1.35s, 1.70s, 2.05s, 2.40s
        All stay until wipe at 9.5s
        Fractions (dur=20s):
          row1: in=1.0/20=0.05, hold=9.5/20=0.475, out=9.8/20=0.49
          row2: in=1.35/20=0.0675
          row3: in=1.70/20=0.085
          row4: in=2.05/20=0.1025
          row5: in=2.40/20=0.12
      ═══════════════════════════════════════
    -->

    <!-- Row 1 -->
    <text x="40" y="138" xml:space="preserve"
          font-family="SFMono-Regular,Menlo,Consolas,monospace"
          font-size="20" font-weight="700" fill="#41B4FF" opacity="0">
      ____  _   _ _   _ ____  ___ _   _
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.05;0.0625;0.475;0.49;1"
               dur="20s" begin="0s" repeatCount="indefinite"/>
    </text>

    <!-- Row 2 -->
    <text x="40" y="159" xml:space="preserve"
          font-family="SFMono-Regular,Menlo,Consolas,monospace"
          font-size="20" font-weight="700" fill="#41B4FF" opacity="0">
      |  _ \| | | | | | |  _ \|_ _| \ | |
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.0675;0.08;0.475;0.49;1"
               dur="20s" begin="0s" repeatCount="indefinite"/>
    </text>

    <!-- Row 3 -->
    <text x="40" y="180" xml:space="preserve"
          font-family="SFMono-Regular,Menlo,Consolas,monospace"
          font-size="20" font-weight="700" fill="#41B4FF" opacity="0">
      | |_) | |_| | | | | |_) || ||  \| |
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.085;0.0975;0.475;0.49;1"
               dur="20s" begin="0s" repeatCount="indefinite"/>
    </text>

    <!-- Row 4 -->
    <text x="40" y="201" xml:space="preserve"
          font-family="SFMono-Regular,Menlo,Consolas,monospace"
          font-size="20" font-weight="700" fill="#41B4FF" opacity="0">
      |  __/|  _  | |_| |  _ &lt; | || |\  |
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.1025;0.115;0.475;0.49;1"
               dur="20s" begin="0s" repeatCount="indefinite"/>
    </text>

    <!-- Row 5 -->
    <text x="40" y="222" xml:space="preserve"
          font-family="SFMono-Regular,Menlo,Consolas,monospace"
          font-size="20" font-weight="700" fill="#41B4FF" opacity="0">
      |_|   |_| |_|\___/|_| \_\___|_| \_|
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.12;0.1325;0.475;0.49;1"
               dur="20s" begin="0s" repeatCount="indefinite"/>
    </text>

    <!--
      ═══════════════════════════════════════
        Subtitle & italic (appear at 3.0s)
        3.0/20=0.15, wipe at 9.5/20=0.475
      ═══════════════════════════════════════
    -->
    <text x="40" y="253"
          font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
          font-size="17" font-weight="700" fill="#FFFFFF" opacity="0">
      Aspiring Cloud &amp; Serverless Architect
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.15;0.165;0.475;0.49;1"
               dur="20s" begin="0s" repeatCount="indefinite"/>
    </text>

    <text x="40" y="278"
          font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif"
          font-size="14" font-style="italic" fill="#9AA5B4" opacity="0">
      CS @ Thammasat University &#183; Designing event-driven, serverless architectures on AWS
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.15;0.165;0.475;0.49;1"
               dur="20s" begin="0s" repeatCount="indefinite"/>
    </text>

    <!--
      ═══════════════════════════════════════
        LINE 2: [cloudshell-user@…]$  (second prompt)
        Appears at 3.5s, stays until wipe at 9.5s
        3.5/20=0.175, wipe 9.5/20=0.475, 9.8/20=0.49
      ═══════════════════════════════════════
    -->
    <text x="40" y="310" xml:space="preserve"
          font-family="SFMono-Regular,Menlo,Consolas,monospace"
          font-size="16" fill="#F0F0F0" opacity="0">
      [cloudshell-user@aws-us-east-1 ~]$
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.175;0.1875;0.475;0.49;1"
               dur="20s" begin="0s" repeatCount="indefinite"/>
    </text>

    <!--
      Blinking cursor at second prompt
      x=414 ≈ end of "[cloudshell-user@aws-us-east-1 ~]$ "
      Visible 3.5s–8.5s (5s of idle blinking), then hides for exit typing
      3.5/20=0.175, 8.5/20=0.425, 8.55/20=0.4275
    -->
    <g opacity="0">
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.175;0.1875;0.425;0.4275;1"
               dur="20s" begin="0s" repeatCount="indefinite"/>
      <rect x="414" y="296" width="9" height="17" fill="#F0F0F0">
        <animate attributeName="opacity"
                 values="1;0;1" keyTimes="0;0.5;1"
                 dur="0.9s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!--
      ═══════════════════════════════════════
        "exit" appended to the second prompt
        Appears at 8.5s (cursor stops), fades with wipe at 9.5s
        8.5/20=0.425, 9.5/20=0.475, 9.8/20=0.49
      ═══════════════════════════════════════
    -->
    <text x="40" y="310" xml:space="preserve"
          font-family="SFMono-Regular,Menlo,Consolas,monospace"
          font-size="16" fill="#F0F0F0" opacity="0">
      [cloudshell-user@aws-us-east-1 ~]$ exit
      <animate attributeName="opacity"
               values="0;0;1;1;0;0"
               keyTimes="0;0.425;0.4375;0.475;0.49;1"
               dur="20s" begin="0s" repeatCount="indefinite"/>
    </text>

  </g>
</svg>