<svg width="900" height="344" viewBox="0 0 900 344" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card"><rect width="900" height="344" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="344" fill="#101B2A"/>

    <!-- Window chrome -->
    <rect x="20" y="14" width="20" height="20" rx="5" fill="#444852"/>
    <text x="30" y="28" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#EBEBF0">&gt;_</text>
    <text x="52" y="29" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#EBEBF0">CloudShell</text>

    <!-- Tab bar -->
    <!-- "us-east-1" at x=22; underline width=54 trimmed to text; "+" moved to x=92 -->
    <text x="22" y="67" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#EBEBF0">us-east-1</text>
    <rect x="22" y="78" width="54" height="2" rx="1" fill="#41B4FF"/>
    <text x="92" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#7C8798">+</text>

    <!--
      ══════════════════════════════════════════════
        TIMELINE  dur=23s
      ══════════════════════════════════════════════
        0.00s  prompt appears
        0.10s  "w"  (200 ms/char)
        0.30s  "wh"
        0.50s  "who"
        0.70s  "whoa"
        0.90s  "whoam"
        1.10s  "whoami"  ← typing done
        1.30s  typing cursor hides
        1.30s  ASCII row 1
        1.65s  row 2 … 2.00s row 3 … 2.35s row 4 … 2.70s row 5
        3.20s  subtitle + italic
        3.70s  2nd prompt + idle cursor ──────┐
               ←──────── 15 s WAIT ─────────→│
       18.70s  exit typed                     │
       19.50s  wipe                           │
       19.80s  blank                          │
       23.00s  restart ──────────────────────┘
      ══════════════════════════════════════════════
      All fractions = time / 23
    -->

    <!-- Stage 0: prompt only — kf 0.001 → 0.004 -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.001;0.004;0.005;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Stage 1: w — kf 0.004 → 0.013 -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ w<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.004;0.005;0.013;0.014;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Stage 2: wh — kf 0.013 → 0.022 -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ wh<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.013;0.014;0.022;0.023;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Stage 3: who — kf 0.022 → 0.030 -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ who<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.022;0.023;0.030;0.031;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Stage 4: whoa — kf 0.030 → 0.039 -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ whoa<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.030;0.031;0.039;0.040;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Stage 5: whoam — kf 0.039 → 0.048 -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ whoam<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.039;0.040;0.048;0.049;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- Stage 6: whoami — kf 0.048 → wipe 0.848 -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ whoami<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.048;0.049;0.848;0.861;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!--
      Typing cursor — visible kf 0.001 → 0.057 (t=0 → t=1.3s)
      x steps: 358→368→378→387→397→407→416
    -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.001;0.002;0.057;0.058;1" dur="23s" begin="0s" repeatCount="indefinite"/>
      <rect y="94" width="9" height="17" fill="#F0F0F0">
        <animate attributeName="x" values="358;358;368;378;387;397;407;416;416" keyTimes="0;0.001;0.004;0.013;0.022;0.030;0.039;0.048;1" calcMode="discrete" dur="23s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.9s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ASCII ROW 1 — 1.30s kf 0.057, full at kf 0.068 -->
    <text x="22" y="138" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0"> ____  _   _ _   _ ____  ___ _   _ <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.057;0.068;0.848;0.861;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ASCII ROW 2 — 1.65s kf 0.072, full at kf 0.083 -->
    <text x="22" y="159" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">|  _ \| | | | | | |  _ \|_ _| \ | |<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.072;0.083;0.848;0.861;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ASCII ROW 3 — 2.00s kf 0.087, full at kf 0.098 -->
    <text x="22" y="180" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">| |_) | |_| | | | | |_) || ||  \| |<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.087;0.098;0.848;0.861;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ASCII ROW 4 — 2.35s kf 0.102, full at kf 0.113 -->
    <text x="22" y="201" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">|  __/|  _  | |_| |  _ &lt; | || |\  |<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.102;0.113;0.848;0.861;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ASCII ROW 5 — 2.70s kf 0.117, full at kf 0.128 -->
    <text x="22" y="222" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">|_|   |_| |_|\___/|_| \_\___|_| \_|<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.117;0.128;0.848;0.861;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- SUBTITLE — 3.20s kf 0.139, full at kf 0.150 -->
    <text x="22" y="253" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" opacity="0">Aspiring Cloud Software Engineer<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.139;0.150;0.848;0.861;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ITALIC line — same timing as subtitle -->
    <text x="22" y="276" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-style="italic" fill="#9AA5B4" opacity="0">Software engineering with a focus on cloud infrastructure, CI/CD, automation, and continuous delivery.<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.139;0.150;0.848;0.861;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- 2ND PROMPT (no exit) — 3.70s kf 0.161, hides at kf 0.813 -->
    <text x="22" y="306" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.161;0.162;0.813;0.814;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

    <!-- IDLE CURSOR — blinks t=3.70s → t=18.70s (15 s)  kf 0.161 → 0.813 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.161;0.162;0.813;0.814;1" dur="23s" begin="0s" repeatCount="indefinite"/>
      <rect x="358" y="292" width="9" height="17" fill="#F0F0F0">
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.9s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- EXIT LINE — 18.70s kf 0.813, fades with wipe kf 0.848 -->
    <text x="22" y="306" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ exit<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.813;0.814;0.848;0.861;1" dur="23s" begin="0s" repeatCount="indefinite"/></text>

  </g>
</svg>