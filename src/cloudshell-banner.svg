<svg width="900" height="344" viewBox="0 0 900 344" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="card"><rect width="900" height="344" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="900" height="344" fill="#101B2A"/>

    <!-- Window chrome -->
    <rect x="20" y="14" width="20" height="20" rx="5" fill="#444852"/>
    <text x="30" y="28" text-anchor="middle" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="11" font-weight="700" fill="#EBEBF0">&gt;_</text>
    <text x="52" y="29" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#EBEBF0">CloudShell</text>

    <!-- Tab bar — x=22 (anchor for everything below) -->
    <text x="22" y="67" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#EBEBF0">us-east-1</text>
    <rect x="22" y="78" width="82" height="2" rx="1" fill="#41B4FF"/>
    <text x="118" y="68" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" fill="#7C8798">+</text>

    <!--
      TIMELINE  dur=13s
      0.000s  prompt "[cloudshell-user@aws-us-east-1 ~]$ " appears; cursor blinks at x=358
      0.100s  "w" typed  → cursor moves to x=368
      0.233s  "wh"       → x=378
      0.367s  "who"      → x=387
      0.500s  "whoa"     → x=397
      0.633s  "whoam"    → x=407
      0.767s  "whoami"   → x=416  (typing done)
      1.000s  typing cursor hides (processing "jam")
      1.000s  ASCII row 1 fades in
      1.350s  row 2 … 1.700s row 3 … 2.050s row 4 … 2.400s row 5
      3.000s  subtitle + italic appear
      3.500s  2nd prompt + idle cursor (5 s blink)
      8.500s  idle cursor hides, "exit" types in
      9.500s  wipe starts
      9.800s  all gone → 3.2 s blank → restart
    -->

    <!-- ── PROMPT BASE (no "whoami") ── appears at t=0, stays till wipe -->
    <text x="22" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.001;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── TYPING STAGES of "whoami" ── each occupies one character interval -->
    <!-- All positioned at x=358 (right where the prompt text ends) -->
    <text x="358" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">w<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.008;0.018;0.019;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>
    <text x="358" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">wh<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.018;0.028;0.029;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>
    <text x="358" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">who<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.028;0.038;0.039;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>
    <text x="358" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">whoa<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.038;0.049;0.050;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>
    <text x="358" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">whoam<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.049;0.059;0.060;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>
    <!-- "whoami" — stays until wipe -->
    <text x="358" y="108" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">whoami<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.059;0.061;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── TYPING CURSOR ── blinks and steps right with each character -->
    <!-- Visible t=0 → t=1.0s (kf=0.077). x steps: 358→368→378→387→397→407→416 -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.001;0.077;0.078;1" dur="13s" begin="0s" repeatCount="indefinite"/>
      <rect y="94" width="9" height="17" fill="#F0F0F0">
        <animate attributeName="x" values="358;358;368;378;387;397;407;416;416" keyTimes="0;0.007;0.008;0.018;0.028;0.038;0.049;0.059;1" calcMode="discrete" dur="13s" begin="0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.9s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ── ASCII ROW 1 ── 1.00s = kf 0.077 -->
    <text x="22" y="138" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0"> ____  _   _ _   _ ____  ___ _   _ <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.077;0.096;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── ASCII ROW 2 ── 1.35s = kf 0.104 -->
    <text x="22" y="159" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">|  _ \| | | | | | |  _ \|_ _| \ | |<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.104;0.123;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── ASCII ROW 3 ── 1.70s = kf 0.131 -->
    <text x="22" y="180" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">| |_) | |_| | | | | |_) || ||  \| |<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.131;0.150;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── ASCII ROW 4 ── 2.05s = kf 0.158 -->
    <text x="22" y="201" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">|  __/|  _  | |_| |  _ &lt; | || |\  |<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.158;0.177;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── ASCII ROW 5 ── 2.40s = kf 0.185 -->
    <text x="22" y="222" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" fill="#41B4FF" opacity="0">|_|   |_| |_|\___/|_| \_\___|_| \_|<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.185;0.204;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── SUBTITLE ── 3.00s = kf 0.231 -->
    <text x="22" y="253" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#FFFFFF" opacity="0">Aspiring Cloud &amp; Serverless Architect<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.231;0.246;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── ITALIC ── 3.00s = kf 0.231 -->
    <text x="22" y="278" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-style="italic" fill="#9AA5B4" opacity="0">CS @ Thammasat University &#183; Designing event-driven, serverless architectures on AWS<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.231;0.246;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── 2ND PROMPT (no exit) ── 3.50s = kf 0.269 -->
    <text x="22" y="310" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.269;0.285;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

    <!-- ── IDLE CURSOR at 2nd prompt ── blinks 3.5s → 8.5s -->
    <!-- x=358: right after prompt text (same 35-char prompt at x=22) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.269;0.285;0.654;0.658;1" dur="13s" begin="0s" repeatCount="indefinite"/>
      <rect x="358" y="296" width="9" height="17" fill="#F0F0F0">
        <animate attributeName="opacity" values="1;0;1" keyTimes="0;0.5;1" dur="0.9s" begin="0s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- ── 2ND PROMPT WITH "exit" ── 8.50s = kf 0.654, fades with wipe -->
    <text x="22" y="310" xml:space="preserve" font-family="SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#F0F0F0" opacity="0">[cloudshell-user@aws-us-east-1 ~]$ exit<animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.654;0.669;0.731;0.754;1" dur="13s" begin="0s" repeatCount="indefinite"/></text>

  </g>
</svg>